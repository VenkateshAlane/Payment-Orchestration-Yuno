spring:
  application:
    name: payment-orchestration
  datasource:
    # Override via environment variables in production:
    #   DB_URL, DB_USERNAME, DB_PASSWORD
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${DB_USERNAME:payments_user}
    password: ${DB_PASSWORD:payments_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      # Override via environment variables in production:
      #   REDIS_HOST, REDIS_PORT
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  lifecycle:
    # Allow in-flight requests up to 30 s to complete before the JVM exits
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers

payment:
  retry:
    max-attempts-per-provider: 3
    initial-backoff-ms: 100
    backoff-multiplier: 2.0
    max-backoff-ms: 2000

provider:
  a:
    failure-rate: 0.3
  b:
    failure-rate: 0.2

idempotency:
  ttl-hours: 24

# Circuit breaker per provider — opens after 50% failure rate over 10 calls,
# stays open for 10 s, then enters half-open with 5 test calls.
resilience4j:
  circuitbreaker:
    instances:
      providerA:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        register-health-indicator: true
      providerB:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        register-health-indicator: true
