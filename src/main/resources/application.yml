spring:
  application:
    name: payment-orchestration
  datasource:
    url: jdbc:postgresql://localhost:5432/payments
    username: payments_user
    password: payments_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

payment:
  retry:
    max-attempts-per-provider: 3
    initial-backoff-ms: 100
    backoff-multiplier: 2.0
    max-backoff-ms: 2000

provider:
  a:
    failure-rate: 0.3
  b:
    failure-rate: 0.2

idempotency:
  ttl-hours: 24
